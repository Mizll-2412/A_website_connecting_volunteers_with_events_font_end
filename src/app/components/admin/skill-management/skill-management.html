<div class="container-fluid py-4">
  <h2 class="mb-4">Quản lý kỹ năng</h2>


  <!-- Form thêm kỹ năng -->
  <div class="card mb-4">
    <div class="card-header">
      <h5 class="mb-0">Thêm kỹ năng mới</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="addSkill()" class="row g-3">
        <div class="col-md-6">
          <label for="skillName" class="form-label">Tên kỹ năng</label>
          <input type="text" class="form-control" id="skillName" [(ngModel)]="newSkill.tenKyNang" name="tenKyNang" required>
        </div>
        <div class="col-md-6">
          <label for="skillDesc" class="form-label">Mô tả (Tùy chọn)</label>
          <input type="text" class="form-control" id="skillDesc" [(ngModel)]="newSkill.moTa" name="moTa">
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary" [disabled]="isLoading">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
            Thêm kỹ năng
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Danh sách kỹ năng -->
  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">Danh sách kỹ năng</h5>
    </div>
    <div class="card-body">
      <app-table
        [columns]="tableColumns"
        [data]="paginatedSkillsList"
        [loading]="isLoading"
        [emptyText]="'Chưa có kỹ năng nào được tạo'"
        [storageKey]="'skill-management'"
      ></app-table>
      
      <app-pagination
        *ngIf="skills.length > 0"
        [totalItems]="skills.length"
        [itemsPerPage]="itemsPerPage"
        [currentPage]="currentPage"
        (pageChange)="onPageChange($event)"
        (itemsPerPageChange)="onItemsPerPageChange($event)"
      ></app-pagination>
    </div>
  </div>

  <!-- Templates -->
  <ng-template #tenKyNangTemplate let-skill>
    <ng-container *ngIf="editingSkill?.maKyNang !== skill.maKyNang; else editTenKyNang">
      {{ skill.tenKyNang }}
    </ng-container>
    <ng-template #editTenKyNang>
      <input type="text" class="form-control form-control-sm" [(ngModel)]="editingSkill!.tenKyNang">
    </ng-template>
  </ng-template>

  <ng-template #moTaTemplate let-skill>
    <ng-container *ngIf="editingSkill?.maKyNang !== skill.maKyNang; else editMoTa">
      {{ skill.moTa || 'N/A' }}
    </ng-container>
    <ng-template #editMoTa>
      <input type="text" class="form-control form-control-sm" [(ngModel)]="editingSkill!.moTa">
    </ng-template>
  </ng-template>

  <ng-template #actionsTemplate let-skill>
    <ng-container *ngIf="editingSkill?.maKyNang !== skill.maKyNang; else editActions">
      <div class="btn-group btn-group-sm">
        <button type="button" class="btn btn-outline-primary" (click)="startEditing(skill)">
          <i class="bi bi-pencil"></i> Sửa
        </button>
        <button type="button" class="btn btn-outline-danger" (click)="deleteSkill(skill.maKyNang!)">
          <i class="bi bi-trash"></i> Xóa
        </button>
      </div>
    </ng-container>
    <ng-template #editActions>
      <div class="btn-group btn-group-sm">
        <button type="button" class="btn btn-outline-success" (click)="updateSkill()">
          <i class="bi bi-check"></i> Lưu
        </button>
        <button type="button" class="btn btn-outline-secondary" (click)="cancelEditing()">
          <i class="bi bi-x"></i> Hủy
        </button>
      </div>
    </ng-template>
  </ng-template>
</div>
