<div class="container-fluid py-4">
  <h2 class="mb-4">Quản lý lĩnh vực</h2>


  <!-- Form thêm lĩnh vực -->
  <div class="card mb-4">
    <div class="card-header">
      <h5 class="mb-0">Thêm lĩnh vực mới</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="addField()" class="row g-3">
        <div class="col-md-6">
          <label for="fieldName" class="form-label">Tên lĩnh vực</label>
          <input type="text" class="form-control" id="fieldName" [(ngModel)]="newField.tenLinhVuc" name="tenLinhVuc" required>
        </div>
        <div class="col-md-6">
          <label for="fieldDesc" class="form-label">Mô tả (Tùy chọn)</label>
          <input type="text" class="form-control" id="fieldDesc" [(ngModel)]="newField.moTa" name="moTa">
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary" [disabled]="isLoading">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
            Thêm lĩnh vực
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Danh sách lĩnh vực -->
  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">Danh sách lĩnh vực</h5>
    </div>
    <div class="card-body">
      <app-table
        [columns]="tableColumns"
        [data]="paginatedFieldsList"
        [loading]="isLoading"
        [emptyText]="'Chưa có lĩnh vực nào được tạo'"
        [storageKey]="'field-management'"
      ></app-table>
      
      <app-pagination
        *ngIf="fields.length > 0"
        [totalItems]="fields.length"
        [itemsPerPage]="itemsPerPage"
        [currentPage]="currentPage"
        (pageChange)="onPageChange($event)"
        (itemsPerPageChange)="onItemsPerPageChange($event)"
      ></app-pagination>
    </div>
  </div>

  <!-- Templates -->
  <ng-template #tenLinhVucTemplate let-field>
    <ng-container *ngIf="editingField?.maLinhVuc !== field.maLinhVuc; else editTenLinhVuc">
      {{ field.tenLinhVuc }}
    </ng-container>
    <ng-template #editTenLinhVuc>
      <input type="text" class="form-control form-control-sm" [(ngModel)]="editingField!.tenLinhVuc">
    </ng-template>
  </ng-template>

  <ng-template #moTaTemplate let-field>
    <ng-container *ngIf="editingField?.maLinhVuc !== field.maLinhVuc; else editMoTa">
      {{ field.moTa || 'N/A' }}
    </ng-container>
    <ng-template #editMoTa>
      <input type="text" class="form-control form-control-sm" [(ngModel)]="editingField!.moTa">
    </ng-template>
  </ng-template>

  <ng-template #actionsTemplate let-field>
    <ng-container *ngIf="editingField?.maLinhVuc !== field.maLinhVuc; else editActions">
      <div class="btn-group btn-group-sm">
        <button type="button" class="btn btn-outline-primary" (click)="startEditing(field)">
          <i class="bi bi-pencil"></i> Sửa
        </button>
        <button type="button" class="btn btn-outline-danger" (click)="deleteField(field.maLinhVuc!)">
          <i class="bi bi-trash"></i> Xóa
        </button>
      </div>
    </ng-container>
    <ng-template #editActions>
      <div class="btn-group btn-group-sm">
        <button type="button" class="btn btn-outline-success" (click)="updateField()">
          <i class="bi bi-check"></i> Lưu
        </button>
        <button type="button" class="btn btn-outline-secondary" (click)="cancelEditing()">
          <i class="bi bi-x"></i> Hủy
        </button>
      </div>
    </ng-template>
  </ng-template>
</div>
