<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm mt-5">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <i class="bi bi-envelope-check" style="font-size: 3rem; color: #2563eb;"></i>
            <h3 class="mt-3 mb-2">Xác nhận đổi email</h3>
          </div>

          <div *ngIf="isLoading" class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Đang xử lý...</span>
            </div>
            <p class="mt-3 text-muted">Đang xác nhận đổi email...</p>
          </div>

          <div *ngIf="successMessage && !isLoading" class="alert alert-success" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            {{ successMessage }}
            <p class="mb-0 mt-2 small">Đang chuyển hướng đến trang profile...</p>
          </div>

          <div *ngIf="errorMessage && !isLoading" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            {{ errorMessage }}
            <div class="mt-3">
              <a routerLink="/profile" class="btn btn-primary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Quay lại trang profile
              </a>
            </div>
          </div>

          <div *ngIf="!isLoading && !successMessage && !errorMessage" class="text-center">
            <p class="text-muted">Vui lòng đợi trong giây lát...</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
