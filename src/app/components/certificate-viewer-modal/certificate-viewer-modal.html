<div class="modal fade" id="certificateViewerModal" tabindex="-1" aria-labelledby="certificateViewerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl modal-fullscreen-md-down">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="certificateViewerModalLabel">
          <i class="bi bi-award-fill me-2"></i>Giấy chứng nhận tình nguyện
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" (click)="closeModal()"></button>
      </div>
      
      <div class="modal-body">
        <!-- Loading -->
        <div *ngIf="isLoading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Đang tải...</span>
          </div>
          <p class="mt-3 text-muted">Đang tải chứng nhận...</p>
        </div>

        <!-- Error -->
        <div *ngIf="errorMessage && !isLoading" class="alert alert-danger">
          <i class="bi bi-exclamation-triangle me-2"></i>
          {{ errorMessage }}
        </div>

        <!-- Certificate Canvas -->
        <div *ngIf="certificateData && !isLoading && !errorMessage" class="certificate-preview">
          <div class="canvas-container">
            <canvas 
              #canvas
              [width]="canvasWidth"
              [height]="canvasHeight"
              class="certificate-canvas">
            </canvas>
          </div>
        </div>
      </div>

      <div class="modal-footer" *ngIf="certificateData && !isLoading">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" (click)="closeModal()">
          <i class="bi bi-x-circle me-1"></i>Đóng
        </button>
        <button type="button" class="btn btn-success" (click)="downloadImage()">
          <i class="bi bi-image me-1"></i>Tải ảnh PNG
        </button>
        <button type="button" class="btn btn-danger" (click)="downloadPDF()">
          <i class="bi bi-file-pdf me-1"></i>Tải PDF
        </button>
      </div>
    </div>
  </div>
</div>
