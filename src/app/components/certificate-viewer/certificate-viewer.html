<div class="certificate-viewer-container">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">
        <i class="bi bi-award me-2"></i>Giấy chứng nhận tình nguyện
      </h5>
    </div>
    
    <div class="card-body">
      <!-- Loading State -->
      <div *ngIf="isLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Đang tải...</span>
        </div>
        <p class="mt-3 text-muted">Đang tải chứng nhận...</p>
      </div>

      <!-- Error State -->
      <div *ngIf="errorMessage && !isLoading" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle me-2"></i>{{ errorMessage }}
      </div>

      <!-- Certificate Preview -->
      <div *ngIf="certificateData && !isLoading" class="certificate-preview">
        <canvas 
          #canvas
          [width]="canvasWidth"
          [height]="canvasHeight"
          class="certificate-canvas">
        </canvas>
      </div>

      <!-- Action Buttons -->
      <div *ngIf="certificateData && !isLoading" class="action-buttons mt-4">
        <div class="row g-2">
          <div class="col-md-4">
            <button class="btn btn-primary w-100" (click)="downloadImage()">
              <i class="bi bi-download me-2"></i>Tải ảnh (PNG)
            </button>
          </div>
          <div class="col-md-4">
            <button class="btn btn-danger w-100" (click)="downloadPDF()">
              <i class="bi bi-file-pdf me-2"></i>Tải PDF
            </button>
          </div>
          <div class="col-md-4">
            <button class="btn btn-outline-primary w-100" (click)="shareCertificate()">
              <i class="bi bi-share me-2"></i>Chia sẻ
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
